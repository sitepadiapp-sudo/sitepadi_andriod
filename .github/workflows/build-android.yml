name: Build Android APK
on:
  push:
    branches: [ main, Revenue-cat-test ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        run: |
          test -f sitepadi-source-v35.b64
          base64 -d sitepadi-source-v35.b64 > sitepadi-source.zip
          unzip -t sitepadi-source.zip
          unzip -o sitepadi-source.zip -d .
      - name: Locate project
        run: |
          if [ -f capacitor.config.ts ]; then echo "PROJECT_DIR=." >> "$GITHUB_ENV"; else echo "PROJECT_DIR=source" >> "$GITHUB_ENV"; fi
      - name: Enforce version 3.8 / 34
        run: |
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 34/' "$PROJECT_DIR/android/app/build.gradle"
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "3.8"/' "$PROJECT_DIR/android/app/build.gradle"
          grep -nE 'versionCode|versionName' "$PROJECT_DIR/android/app/build.gradle"
      - name: Place Google services
        run: |
          if [ -f google-services.json ]; then mkdir -p "$PROJECT_DIR/android/app"; cp google-services.json "$PROJECT_DIR/android/app/google-services.json"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and sync
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm install --no-save typescript
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Build
        run: |
          chmod +x "$PROJECT_DIR/android/gradlew"
          cd "$PROJECT_DIR/android"
          ./gradlew assembleDebug bundleRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sitepadi-release-aab
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sitepadi-release-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
