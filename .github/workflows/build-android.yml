name: Build Android APK

# Runs automatically on every push to main/master, and can also be
# triggered manually from the Actions tab on GitHub's website (click
# "Run workflow") — useful if you just want a fresh APK without
# pushing a code change.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    # GitHub provides this machine for free — this is the "cloud
    # computer" doing the actual build, not your laptop.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Project was uploaded as a single sitepadi-source.zip (GitHub's
      # web upload only allows 100 files per commit — way fewer than
      # this project has — so the whole thing goes in as one file and
      # gets unzipped here instead).
      - name: Unzip project source
        run: |
          if [ -f sitepadi-source.zip ]; then
            unzip -o sitepadi-source.zip -d .
          fi

      # google-services.json (downloaded from Firebase Console) gets
      # uploaded to the repo root via GitHub's web UI, since uploading
      # into a specific nested folder from a phone is fiddly. Move it
      # into the one place the Android build actually looks for it.
      - name: Locate Capacitor project
        run: |
          if [ -f capacitor.config.ts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f source/capacitor.config.ts ]; then
            echo "PROJECT_DIR=source" >> "$GITHUB_ENV"
          else
            PROJECT_DIR=$(dirname "$(find . -name capacitor.config.ts -type f -print -quit)")
            if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
              echo "ERROR: capacitor.config.ts not found after unzipping the project."
              exit 1
            fi
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi
          echo "Capacitor project: ${PROJECT_DIR:-detected}"

      - name: Set SitePadi version
        run: |
          BUILD_GRADLE="$PROJECT_DIR/android/app/build.gradle"
          test -f "$BUILD_GRADLE" || { echo "ERROR: $BUILD_GRADLE not found"; exit 1; }
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 16/' "$BUILD_GRADLE"
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "2.0"/' "$BUILD_GRADLE"
          echo "SitePadi version set to versionCode 16 / versionName 2.0"
          grep -nE 'versionCode|versionName' "$BUILD_GRADLE"

      - name: Place google-services.json
        run: |
          if [ -f google-services.json ]; then
            mkdir -p "$PROJECT_DIR/android/app"
            cp google-services.json "$PROJECT_DIR/android/app/google-services.json"
            echo "google-services.json placed in $PROJECT_DIR/android/app/"
          else
            echo "No google-services.json at repo root — skipping"
          fi

      # capacitor.config.ts and strings.xml live inside sitepadi-source.zip,
      # so they can't be hand-edited on GitHub's website like the workflow
      # file can. Patch the real Google Sign-In Web Client ID in here
      # instead, every build, so the zip itself never needs touching.
      - name: Apply Google Sign-In Web Client ID
        run: |
          CONFIG="$PROJECT_DIR/capacitor.config.ts"
          STRINGS="$PROJECT_DIR/android/app/src/main/res/values/strings.xml"
          test -f "$CONFIG" || { echo "ERROR: $CONFIG not found"; exit 1; }
          sed -i "s/REPLACE_ME.apps.googleusercontent.com/211099277111-d7nrolgkmi1nde88fon5cs01f39r40sq.apps.googleusercontent.com/g" "$CONFIG"
          if [ -f "$STRINGS" ]; then
            sed -i "s/REPLACE_ME.apps.googleusercontent.com/211099277111-d7nrolgkmi1nde88fon5cs01f39r40sq.apps.googleusercontent.com/g" "$STRINGS"
          else
            echo "strings.xml not found; skipping Web Client ID patch there"
          fi
          echo "Web Client ID applied"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm install --no-save typescript

      - name: Sync Capacitor (copies www/ into android/)
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR/android"
          ./gradlew assembleDebug --no-daemon

      # Release keystore never lives in the repo (unlike debug.keystore) —
      # it's stored as a GitHub Secret (base64-encoded) and only exists
      # as a real file transiently during this build, on GitHub's own
      # server. If the secret isn't set yet, this step does nothing and
      # the release build below just produces an unsigned artifact
      # instead of failing.
      - name: Write release keystore from secret
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$PROJECT_DIR/android/app/release.keystore"
            echo "Release keystore written"
          else
            echo "RELEASE_KEYSTORE_BASE64 secret not set yet — skipping (release build will be unsigned)"
          fi

      - name: Build signed release (AAB + APK)
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          cd "$PROJECT_DIR/android"
          ./gradlew bundleRelease assembleRelease --no-daemon

      # The finished APK shows up as a downloadable "artifact" on the
      # Actions run's results page — no terminal needed to get it.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sitepadi-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # .aab is what the Play Store actually requires for submission.
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sitepadi-release-aab
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: ignore

      # Signed APK — useful for sideloading to verify the signed release
      # build actually works before uploading the AAB to Play Console.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sitepadi-release-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: ignore
