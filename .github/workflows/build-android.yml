name: Build Android from Release Asset
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download verified source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download sitepadi-source-v3.8 --repo "${{ github.repository }}"             --pattern "sitepadi-source-v37-3.8-REVENUECAT-13.5.0-FINAL.zip" --dir .
          test -f sitepadi-source-v37-3.8-REVENUECAT-13.5.0-FINAL.zip
          unzip -t sitepadi-source-v37-3.8-REVENUECAT-13.5.0-FINAL.zip
          unzip -o sitepadi-source-v37-3.8-REVENUECAT-13.5.0-FINAL.zip -d .
      - name: Locate project
        run: |
          if [ -f capacitor.config.ts ]; then echo "PROJECT_DIR=." >> "$GITHUB_ENV";           elif [ -f source/capacitor.config.ts ]; then echo "PROJECT_DIR=source" >> "$GITHUB_ENV";           else exit 1; fi
      - name: Verify final versions and RevenueCat version
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open("$PROJECT_DIR/package.json"))
          l=json.load(open("$PROJECT_DIR/package-lock.json"))
          assert p["version"]=="3.8.0"
          assert p["dependencies"]["@revenuecat/purchases-capacitor"]=="13.5.0"
          assert l["packages"]["node_modules/@revenuecat/purchases-capacitor"]["version"]=="13.5.0"
          print("package versions verified")
          PY
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 34/' "$PROJECT_DIR/android/app/build.gradle"
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "3.8"/' "$PROJECT_DIR/android/app/build.gradle"
          grep -nE 'versionCode|versionName' "$PROJECT_DIR/android/app/build.gradle"
      - name: Place Google services
        run: |
          if [ -f google-services.json ]; then mkdir -p "$PROJECT_DIR/android/app"; cp google-services.json "$PROJECT_DIR/android/app/google-services.json"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact locked dependencies
        run: |
          cd "$PROJECT_DIR"
          npm ci
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Build AAB and APK
        run: |
          chmod +x "$PROJECT_DIR/android/gradlew"
          cd "$PROJECT_DIR/android"
          ./gradlew bundleRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sitepadi-3.8-release-aab
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sitepadi-3.8-release-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
