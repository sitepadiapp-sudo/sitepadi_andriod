name: Build SitePadi Android 3.8

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate final SitePadi source ZIP
        run: |
          ZIP="sitepadi-source-v37-3.8-REVENUECAT-13.5.0-FINAL.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP not found in repository root."
            echo "Upload the ZIP to the repository root, then run this workflow."
            exit 1
          }
          unzip -t "$ZIP"

      - name: Extract final source
        run: |
          rm -rf build-source
          mkdir -p build-source
          unzip -q "sitepadi-source-v37-3.8-REVENUECAT-13.5.0-FINAL.zip" -d build-source

          if [ -f build-source/capacitor.config.ts ]; then
            echo "PROJECT_DIR=build-source" >> "$GITHUB_ENV"
          elif [ -f build-source/source/capacitor.config.ts ]; then
            echo "PROJECT_DIR=build-source/source" >> "$GITHUB_ENV"
          else
            PROJECT_DIR=$(dirname "$(find build-source -name capacitor.config.ts -type f -print -quit)")
            test -n "$PROJECT_DIR" || {
              echo "ERROR: capacitor.config.ts not found."
              exit 1
            }
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Verify RevenueCat version
        run: |
          test -f "$PROJECT_DIR/package.json"
          grep -q '"@revenuecat/purchases-capacitor"[[:space:]]*:[[:space:]]*"13.5.0"' "$PROJECT_DIR/package.json" || {
            echo "ERROR: RevenueCat 13.5.0 not found in package.json."
            exit 1
          }

          if [ -f "$PROJECT_DIR/package-lock.json" ]; then
            grep -q '"@revenuecat/purchases-capacitor"[[:space:]]*:[[:space:]]*"13.5.0"' "$PROJECT_DIR/package-lock.json" || {
              echo "ERROR: RevenueCat 13.5.0 not found in package-lock.json."
              exit 1
            }
          fi

      - name: Enforce Android version 3.8 / 34
        run: |
          BUILD_GRADLE="$PROJECT_DIR/android/app/build.gradle"
          test -f "$BUILD_GRADLE" || {
            echo "ERROR: $BUILD_GRADLE not found."
            exit 1
          }

          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 34/' "$BUILD_GRADLE"
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "3.8"/' "$BUILD_GRADLE"

          grep -nE 'versionCode|versionName' "$BUILD_GRADLE"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant Gradle execute permission
        run: chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Write release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$PROJECT_DIR/android/app/release.keystore"
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK and AAB
        working-directory: ${{ env.PROJECT_DIR }}/android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sitepadi-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sitepadi-release-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sitepadi-release-aab
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
